const R=Math.PI/180,sn=a=>Math.sin(a*R),cs=a=>Math.cos(a*R),ac=x=>Math.acos(Math.max(-1,Math.min(1,x)))/R;
function pt(d){const lat=st.lat||23.81,lng=st.lng||90.41,tz=st.tz==null?6:st.tz;
const D=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)/864e5+2440587.5-2451545;
const g=(357.529+.98560028*D)%360,q=(280.459+.98564736*D)%360,Ls=(q+1.915*sn(g)+.02*sn(2*g))%360,e=23.439-3.6e-7*D;
const ra=((Math.atan2(cs(e)*sn(Ls),cs(Ls))/R)/15+24)%24,dec=Math.asin(sn(e)*sn(Ls))/R;let eq=q/15-ra;eq-=24*Math.round(eq/24);
const nn=12+tz-lng/15-eq,f=a=>ac((-sn(a)-sn(dec)*sn(lat))/(cs(dec)*cs(lat)))/15,aa=-Math.atan(1/(2+Math.tan(Math.abs(lat-dec)*R)))/R;
return [['ফজর',nn-f(18)],['সূর্যোদয়',nn-f(.833)],['যোহর',nn+1/60],['আসর',nn+f(aa)],['মাগরিব',nn+f(.833)],['ইশা',nn+f(18)]]}
const fm=h=>{h=(h+24)%24;let a=Math.floor(h),m=Math.round((h-a)*60);if(m==60){a++;m=0}const s=a>=12?'PM':'AM';return bn(((a+11)%12)+1)+':'+bn(String(m).padStart(2,'0'))+' '+s}
function nxt(){const n=new Date(),h=n.getHours()+n.getMinutes()/60+n.getSeconds()/3600,l=pt(n).filter(x=>x[0]!='সূর্যোদয়');let x=l.find(x=>x[1]>h),t;if(x)t=x[1]-h;else{x=l[0];t=x[1]+24-h}const s=Math.floor(t*3600);return {n:x[0],t:x[1],c:[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>bn(String(v).padStart(2,'0'))).join(':')}}
function qib(){const lat=st.lat||23.81,lng=st.lng||90.41,d=39.8262-lng;return (Math.atan2(sn(d),cs(lat)*Math.tan(21.4225*R)-sn(lat)*cs(d))/R+360)%360}

const QAPI='https://quranenc.com/api/v1';
const qdb=()=>new Promise((resolve,reject)=>{const r=indexedDB.open('IslamicLifeQuran',1);r.onupgradeneeded=()=>r.result.createObjectStore('surahs',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function qget(id){try{const db=await qdb();return await new Promise((res,rej)=>{const r=db.transaction('surahs').objectStore('surahs').get(+id);r.onsuccess=()=>res(r.result?.data||null);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function qput(id,data){try{const db=await qdb();await new Promise((res,rej)=>{const r=db.transaction('surahs','readwrite').objectStore('surahs').put({id:+id,data,at:Date.now()});r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}catch(e){}}

function safeTxt(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bnCal(d){
 const months=['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];
 const y=d.getFullYear(), leap=(y%4===0&&y%100!==0)||y%400===0;
 const start=new Date(y,3,14); // Bangladesh revised calendar: Boishakh 1 = 14 April
 let by=y-593, dayOffset=Math.floor((d-start)/86400000);
 if(dayOffset<0){by--;dayOffset+=365+((y-1)%4===0?1:0)}
 const lens=[31,31,31,31,31,30,30,30,30,30,leap?30:29,30];
 let mi=0;while(mi<11&&dayOffset>=lens[mi]){dayOffset-=lens[mi];mi++}
 return {day:dayOffset+1,month:months[mi],year:by};
}
function compactDate(){
 const d=new Date(),b=bnCal(d);
 const en=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric'}).format(d);
 return bn(b.day)+' '+b.month+' '+bn(b.year)+' বঙ্গাব্দ  •  '+safeTxt(en);
}
function tripleDate(){
 const d=new Date(),b=bnCal(d);
 let h='';try{h=new Intl.DateTimeFormat('bn-BD-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){h=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(d)}
 const en=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric'}).format(d);

}

function saveManualLocation(){
 const val=id=>document.getElementById(id)?.value?.trim()||'';
 const lat=parseFloat(val('locLat')),lng=parseFloat(val('locLng'));
 if(Number.isFinite(lat)&&Number.isFinite(lng)&&(Math.abs(lat)>90||Math.abs(lng)>180)){alert('Latitude/Longitude সঠিক নয়।');return}
 locMeta.division=val('locDiv');locMeta.district=val('locDist');locMeta.upazila=val('locUp');locMeta.union=val('locUnion');locMeta.village=val('locVillage');
 if(Number.isFinite(lat)&&Number.isFinite(lng)){locMeta.lat=lat;locMeta.lng=lng;st.lat=lat;st.lng=lng;st.tz=6}
 W('il_location',locMeta);W('st',st);alert('অবস্থানের তথ্য সংরক্ষণ হয়েছে।');go();
}
async function loc(){
 if(!navigator.geolocation){alert('এই ডিভাইসে GPS সমর্থিত নয়।');return}
 navigator.geolocation.getCurrentPosition(async p=>{
  st.lat=p.coords.latitude;st.lng=p.coords.longitude;st.tz=6;
  locMeta.lat=st.lat;locMeta.lng=st.lng;
  try{
   const u=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${st.lat}&lon=${st.lng}&accept-language=bn`;
   const r=await fetch(u);if(r.ok){const j=await r.json(),a=j.address||{};
    locMeta.division=a.state||a.region||locMeta.division||'';
    locMeta.district=a.state_district||a.county||a.city_district||locMeta.district||'';
    locMeta.upazila=a.city||a.town||a.municipality||a.suburb||locMeta.upazila||'';
    locMeta.union=a.village||a.neighbourhood||a.hamlet||locMeta.union||'';
    locMeta.village=a.road||a.quarter||a.residential||locMeta.village||'';
   }
  }catch(e){}
  W('il_location',locMeta);W('st',st);alert('GPS অবস্থান সংরক্ষণ হয়েছে। নামাজের সময় এখন এই স্থানাঙ্ক অনুযায়ী গণনা হবে।');go();
 },e=>alert('অবস্থান পাওয়া যায়নি। ব্রাউজার/ফোনে Location Permission চালু করুন অথবা নিজে অবস্থান লিখুন।'),{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}

function addStudent(){const d=madrasaStore(),v=id=>document.getElementById(id).value.trim();if(!v('msName')||!v('msClass')){alert('নাম ও জামাত লিখুন');return}d.students.push({name:v('msName'),cls:v('msClass'),roll:v('msRoll'),phone:v('msPhone')});saveMadrasa(d);go()}

function saveMark(){const d=madrasaStore(),roll=document.getElementById('exRoll').value.trim(),score=+document.getElementById('exScore').value,total=+document.getElementById('exTotal').value,s=d.students.find(x=>x.roll===roll);if(!roll||!Number.isFinite(score)||!total||score<0||score>total){alert('রোল ও সঠিক নম্বর দিন');return}d.marks.push({roll,student:s?.name||'',exam:document.getElementById('exName').value,subject:document.getElementById('exSubject').value,score,total});saveMadrasa(d);alert('নম্বর সংরক্ষণ হয়েছে');go()}
function addTeacher(){const d=madrasaStore();d.teachers=d.teachers||[];d.teachers.push({name:document.getElementById('teacherName').value,role:document.getElementById('teacherRole').value});saveMadrasa(d);go()}
function addRoutine(){const d=madrasaStore();d.routine=d.routine||[];d.routine.push({day:document.getElementById('rtDay').value,info:document.getElementById('rtInfo').value});saveMadrasa(d);go()}
function addNotice(){const d=madrasaStore();d.notices.push({text:document.getElementById('noticeText').value,date:new Date().toLocaleDateString('bn-BD')});saveMadrasa(d);go()}
function addFee(){const d=madrasaStore();d.fees=d.fees||[];d.fees.push({roll:document.getElementById('feeRoll').value,month:document.getElementById('feeMonth').value,amount:+document.getElementById('feeAmount').value});saveMadrasa(d);go()}
